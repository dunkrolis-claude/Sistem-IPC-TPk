<script>
  // Local persistence shim.
  // Replaces the Claude-artifact "window.storage" API with browser localStorage
  // so the app runs as a plain static site (GitHub Pages / Vercel, no backend).
  // NOTE: data is saved per-browser/device only — it is NOT shared automatically
  // between different Admin On Duty devices. Upgrade to a real backend
  // (e.g. Supabase/Firebase) when you're ready to move past a single-device pilot.
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix) {
      prefix = prefix || "";
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
</script>

/* ---------------------------------------------------------------------- */
/* Small utilities                                                         */

function fmtDateTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} - ${hh}:${mm}`;
}

function fmtDuration(ms) {
  if (ms < 0) ms = 0;
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}h ${m}m`;
}

function fmtAgo(iso, now) {
  const diff = now - new Date(iso).getTime();
  if (diff < 60000) return "just now";
  const min = Math.floor(diff / 60000);
  if (min < 60) return `${min}m ago`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${h}h ${m}m ago`;
}

function uid(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
}

/* ---------------------------------------------------------------------- */
/* Storage layer                                                           */
/* ---------------------------------------------------------------------- */

async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, true);
    if (res && res.value) return JSON.parse(res.value);
    return fallback;
  } catch {
    return fallback;
  }
}

async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), true);
  } catch (e) {
    console.error("storage save failed", key, e);
  }
}

/* ---------------------------------------------------------------------- */
/* Priority / Need Attention logic                                         */
/* ---------------------------------------------------------------------- */

function getPriority(eq, incident, now) {
  if (!incident || incident.status !== "open") return null;
  const start = new Date(incident.startTime).getTime();
  const downtimeMs = now - start;
  const downtimeH = downtimeMs / 3600000;
  const etaExceeded = incident.eta && now > new Date(incident.eta).getTime();

  const lastActivity = incident.updates.length
    ? new Date(incident.updates[incident.updates.length - 1].timestamp).getTime()
    : start;
  const staleH = (now - lastActivity) / 3600000;
  const stale = staleH > 2;

  let level = "HIGH";
  if (downtimeH > 8 || etaExceeded || eq.criticality === "critical") level = "CRITICAL";
  else if (downtimeH > 4) level = "HIGH";

  const flags = [];
  if (etaExceeded) flags.push("ETA OVERDUE");
  if (stale) flags.push("STALE UPDATE");
  if (eq.criticality === "critical") flags.push("CRITICAL EQUIPMENT");

  return { level, flags, downtimeMs, stale, etaExceeded };
}

    </span>

}

function StatusBadge({ status, size = "sm" }) {
  const s = STATUS[status];
  const pad = size === "lg" ? "px-3 py-1.5 text-sm" : "px-2 py-1 text-[11px]";
  return (
    <span className={`inline-flex items-center gap-1.5 rounded-md ${s.soft} ${s.text} ${pad} font-mono font-medium tracking-wide ring-1 ${s.ring}`}>
      <StatusDot status={status} pulse={status === "BREAKDOWN"} />
      {s.label}
    </span>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [equipment, setEquipment] = useState([]);
  const [incidents, setIncidents] = useState([]);
  const [history, setHistory] = useState([]);
  const [handovers, setHandovers] = useState([]);
  const [audit, setAudit] = useState([]);

  const [role, setRole] = useState("admin");
  const [tab, setTab] = useState("tower");
  const [now, setNow] = useState(Date.now());

  const [selectedId, setSelectedId] = useState(null);
  const [updateModalEq, setUpdateModalEq] = useState(null);
  const [addEqOpen, setAddEqOpen] = useState(false);
  const [handoverOpen, setHandoverOpen] = useState(false);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 60000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    (async () => {
      const seedEq = seedEquipment();
      const seedInc = seedIncidents();
      const seedHist = seedHistory();

      const [eq, inc, hist, ho, aud] = await Promise.all([
        loadKey(STORAGE_KEYS.equipment, seedEq),
        loadKey(STORAGE_KEYS.incidents, seedInc),
        loadKey(STORAGE_KEYS.history, seedHist),
        loadKey(STORAGE_KEYS.handovers, []),
        loadKey(STORAGE_KEYS.audit, []),
      ]);
      setEquipment(eq);
      setIncidents(inc);
      setHistory(hist);
      setHandovers(ho);
      setAudit(aud);
      setLoading(false);
    })();
  }, []);

  const persistEquipment = useCallback((next) => { setEquipment(next); saveKey(STORAGE_KEYS.equipment, next); }, []);
  const persistIncidents = useCallback((next) => { setIncidents(next); saveKey(STORAGE_KEYS.incidents, next); }, []);
  const persistHistory = useCallback((next) => { setHistory(next); saveKey(STORAGE_KEYS.history, next); }, []);
  const persistHandovers = useCallback((next) => { setHandovers(next); saveKey(STORAGE_KEYS.handovers, next); }, []);
  const persistAudit = useCallback((next) => { setAudit(next); saveKey(STORAGE_KEYS.audit, next); }, []);

  const addAudit = useCallback((action, target, detail) => {
    const entry = { id: uid("AUD"), timestamp: new Date().toISOString(), user: ROLES[role].label, action, target, detail };
    persistAudit([entry, ...audit].slice(0, 500));
  }, [audit, role, persistAudit]);

  const openIncidentByEq = useMemo(() => {
    const map = {};
    incidents.forEach((i) => { if (i.status === "open") map[i.equipmentId] = i; });
    return map;
  }, [incidents]);

  const needAttention = useMemo(() => {
    return equipment
      .map((eq) => {
        const inc = openIncidentByEq[eq.id];
        const p = getPriority(eq, inc, now);
        return p ? { eq, inc, ...p } : null;
      })
      .filter(Boolean)
      .sort((a, b) => (a.level === b.level ? b.downtimeMs - a.downtimeMs : a.level === "CRITICAL" ? -1 : 1));
  }, [equipment, openIncidentByEq, now]);

  const activeEq = equipment.filter((e) => e.active !== false);
  const counts = {
    total: activeEq.length,
    READY: activeEq.filter((e) => e.status === "READY").length,
    READY_NOTE: activeEq.filter((e) => e.status === "READY_NOTE").length,
    MAINTENANCE: activeEq.filter((e) => e.status === "MAINTENANCE").length,
    BREAKDOWN: activeEq.filter((e) => e.status === "BREAKDOWN").length,
    OUT_OF_SERVICE: activeEq.filter((e) => e.status === "OUT_OF_SERVICE").length,
  };
  const readiness = activeEq.length ? Math.round((counts.READY / activeEq.length) * 100) : 0;

  /* ---------------- actions ---------------- */

  function applyStatusChange({ eq, newStatus, remark, problemCategory, pic, eta, photoNote }) {
    const timestamp = new Date().toISOString();
    const userLabel = ROLES[role].label;

    // status history
    const histEntry = { id: uid("H"), equipmentId: eq.id, from: eq.status, to: newStatus, timestamp, user: userLabel, remark: remark || "-" };
    persistHistory([histEntry, ...history]);

    let nextIncidents = incidents;
    const openInc = openIncidentByEq[eq.id];

    if (newStatus === "BREAKDOWN" && eq.status !== "BREAKDOWN") {
      const inc = {
        id: uid("INC"),
        equipmentId: eq.id,
        problemCategory: problemCategory || "General",
        problem: remark || "Unspecified issue",
        pic: pic || "Unassigned",
        eta: eta || null,
        startTime: timestamp,
        endTime: null,
        status: "open",
        updates: photoNote ? [{ timestamp, user: userLabel, note: photoNote }] : [],
      };
      nextIncidents = [inc, ...incidents];
      addAudit("Incident created", eq.id, `${inc.id}: ${inc.problem}`);
    } else if (eq.status === "BREAKDOWN" && newStatus === "READY" && openInc) {
      const downtimeMinutes = Math.round((new Date(timestamp) - new Date(openInc.startTime)) / 60000);
      nextIncidents = incidents.map((i) => i.id === openInc.id ? { ...i, status: "closed", endTime: timestamp, downtimeMinutes } : i);
      addAudit("Incident closed", eq.id, `${openInc.id}: downtime ${fmtDuration(downtimeMinutes * 60000)}`);
    } else if (eq.status === "BREAKDOWN" && newStatus === "BREAKDOWN" && openInc) {
      // progress update without changing current status handled separately (addProgress)
    }

    persistIncidents(nextIncidents);

    const nextEq = equipment.map((e) => e.id === eq.id ? { ...e, status: newStatus, remark: remark || e.remark, lastUpdate: timestamp, updatedBy: userLabel } : e);
    persistEquipment(nextEq);

    addAudit("Status changed", eq.id, `${STATUS[eq.status].label} → ${STATUS[newStatus].label}`);
    setUpdateModalEq(null);
  }

  function addProgress(eq, note) {
    const inc = openIncidentByEq[eq.id];
    if (!inc) return;
    const timestamp = new Date().toISOString();
    const nextIncidents = incidents.map((i) => i.id === inc.id ? { ...i, updates: [...i.updates, { timestamp, user: ROLES[role].label, note }] } : i);
    persistIncidents(nextIncidents);
    const nextEq = equipment.map((e) => e.id === eq.id ? { ...e, lastUpdate: timestamp } : e);
    persistEquipment(nextEq);
    addAudit("Progress update", eq.id, note);
  }

  function addEquipment(newEq) {
    const entry = { ...newEq, status: "READY", remark: "-", lastUpdate: new Date().toISOString(), updatedBy: ROLES[role].label, active: true };
    persistEquipment([entry, ...equipment]);
    addAudit("Equipment created", entry.id, `${entry.name} (${entry.category}/${entry.subArea})`);
    setAddEqOpen(false);
  }

  function submitHandover(payload) {
    const entry = { id: uid("HO"), createdAt: new Date().toISOString(), ...payload };
    persistHandovers([entry, ...handovers]);
    addAudit("Shift handover", entry.shift, `${entry.fromUser} → ${entry.toUser}`);
    setHandoverOpen(false);
  }

  const selectedEq = equipment.find((e) => e.id === selectedId) || null;

  if (loading) {
    return (
      <div className="h-screen w-full flex items-center justify-center bg-slate-950 text-slate-400 font-mono text-sm">
        <RefreshCw className="animate-spin mr-2" size={16} /> Loading Control Tower…
      </div>
    );
  }

  return (
    <div className="h-screen w-full bg-slate-950 text-slate-200 flex flex-col overflow-hidden" style={{ fontFamily: "Inter, ui-sans-serif, system-ui" }}>
      <TopBar role={role} setRole={setRole} now={now} readiness={readiness} needCount={needAttention.length} />

      <div className="flex-1 flex overflow-hidden">
        <SideNav tab={tab} setTab={setTab} needCount={needAttention.length} role={role} onHandover={() => setHandoverOpen(true)} />

        <main className="flex-1 overflow-y-auto">
          {tab === "tower" && (
            <ControlTower
              counts={counts} readiness={readiness} needAttention={needAttention}
              onOpenEq={(id) => setSelectedId(id)} now={now}
            />
          )}
          {tab === "equipment" && (
            <EquipmentTab
              equipment={activeEq} openIncidentByEq={openIncidentByEq}
              onOpenEq={(id) => setSelectedId(id)}
              onUpdate={(eq) => setUpdateModalEq(eq)}
              canEdit={ROLES[role].canEdit}
              canMaster={ROLES[role].canMaster}
              onAddEquipment={() => setAddEqOpen(true)}
            />
          )}
          {tab === "handover" && (
            <HandoverTab handovers={handovers} onNew={() => setHandoverOpen(true)} canHandover={ROLES[role].canHandover} />
          )}
          {tab === "audit" && <AuditTab audit={audit} />}
        </main>
      </div>

      {selectedEq && (
        <DetailDrawer
          eq={selectedEq}
          incident={openIncidentByEq[selectedEq.id]}
          history={history.filter((h) => h.equipmentId === selectedEq.id)}
          onClose={() => setSelectedId(null)}
          onUpdate={() => setUpdateModalEq(selectedEq)}
          onAddProgress={(note) => addProgress(selectedEq, note)}
          canEdit={ROLES[role].canEdit}
          now={now}
        />
      )}

      {updateModalEq && (
        <UpdateStatusModal
          eq={updateModalEq}
          incident={openIncidentByEq[updateModalEq.id]}
          onClose={() => setUpdateModalEq(null)}
          onSubmit={applyStatusChange}
        />
      )}

      {addEqOpen && (
        <AddEquipmentModal onClose={() => setAddEqOpen(false)} onSubmit={addEquipment} />
      )}

      {handoverOpen && (
        <HandoverModal onClose={() => setHandoverOpen(false)} onSubmit={submitHandover} equipment={activeEq} needAttention={needAttention} />
      )}
    </div>
  );
}

function ReadinessRing({ pct }) {
  const r = 26, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  const color = pct >= 90 ? "#34d399" : pct >= 70 ? "#fbbf24" : "#f87171";
  return (
    <svg width="64" height="64" viewBox="0 0 64 64" className="shrink-0">
      <circle cx="32" cy="32" r={r} fill="none" stroke="#1e293b" strokeWidth="6" />
      <circle
        cx="32" cy="32" r={r} fill="none" stroke={color} strokeWidth="6" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={offset} transform="rotate(-90 32 32)"
        style={{ transition: "stroke-dashoffset 0.6s ease" }}
      />
    </svg>
  );
}

function EquipmentTab({ equipment, openIncidentByEq, onOpenEq, onUpdate, canEdit, canMaster, onAddEquipment }) {
  const [filter, setFilter] = useState("ALL");
  const [subArea, setSubArea] = useState("ALL");
  const [q, setQ] = useState("");

  const filtered = equipment.filter((e) => {
    if (filter !== "ALL" && e.status !== filter) return false;
    if (subArea !== "ALL" && e.subArea !== subArea) return false;
    if (q && !(`${e.id} ${e.name} ${e.category}`.toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  });

  const filterChips = [
    { key: "ALL", label: "All" },
    { key: "READY", label: "Ready" },
    { key: "READY_NOTE", label: "Note" },
    { key: "MAINTENANCE", label: "Maint." },
    { key: "BREAKDOWN", label: "Breakdown" },
    { key: "OUT_OF_SERVICE", label: "OOS" },
  ];

  return (
    <div className="p-5 space-y-4">
      <div className="flex flex-col sm:flex-row sm:items-center gap-3">
        <div className="relative flex-1 max-w-sm">
          <Search size={14} className="absolute left-2.5 top-2.5 text-slate-500" />
          <input
            value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search equipment ID or name…"
            className="w-full bg-slate-900 border border-slate-700 rounded-md pl-8 pr-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
          />
        </div>
        <select value={subArea} onChange={(e) => setSubArea(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-md px-2 py-2 text-sm text-slate-200">
          <option value="ALL">All Sub-Areas</option>
          {SUB_AREAS.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        {canMaster && (
          <button onClick={onAddEquipment} className="flex items-center gap-1.5 bg-cyan-500/10 text-cyan-300 ring-1 ring-cyan-500/30 rounded-md px-3 py-2 text-sm hover:bg-cyan-500/20">
            <Plus size={14} /> Add Equipment
          </button>
        )}
      </div>

      <div className="flex gap-1.5 flex-wrap">
        {filterChips.map((c) => (
          <button
            key={c.key} onClick={() => setFilter(c.key)}
            className={`text-xs font-mono px-2.5 py-1 rounded-full border transition-colors ${
              filter === c.key ? "bg-slate-100 text-slate-900 border-slate-100" : "border-slate-700 text-slate-400 hover:border-slate-500"
            }`}
          >{c.label}</button>
        ))}
      </div>

      <div className="rounded-xl border border-slate-800 overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-slate-900 text-slate-400 text-[11px] uppercase tracking-wide">
              <th className="text-left px-4 py-2.5 font-medium">Equipment</th>
              <th className="text-left px-4 py-2.5 font-medium hidden md:table-cell">Sub-Area</th>
              <th className="text-left px-4 py-2.5 font-medium">Status</th>
              <th className="text-left px-4 py-2.5 font-medium hidden lg:table-cell">Remark</th>
              <th className="text-left px-4 py-2.5 font-medium hidden sm:table-cell">Last Update</th>
              <th className="px-4 py-2.5"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-800">
            {filtered.map((eq) => (
              <tr key={eq.id} className="hover:bg-slate-900/50 cursor-pointer" onClick={() => onOpenEq(eq.id)}>
                <td className="px-4 py-2.5">
                  <div className="font-mono text-slate-100">{eq.id}</div>
                  <div className="text-[11px] text-slate-500">{eq.name}</div>

                <td className="px-4 py-2.5"><StatusBadge status={eq.status} /></td>
                <td className="px-4 py-2.5 hidden lg:table-cell text-slate-400 text-xs max-w-[220px] truncate">{eq.remark}</td>
                <td className="px-4 py-2.5 hidden sm:table-cell text-slate-500 font-mono text-xs">{fmtDateTime(eq.lastUpdate)}</td>
                <td className="px-4 py-2.5 text-right">
                  {canEdit && (
                    <button
                      onClick={(e) => { e.stopPropagation(); onUpdate(eq); }}
                      className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md px-2.5 py-1.5"

            )}

        </table>
      </div>
    </div>
  );
}

  return (
    <Modal onClose={onClose} title={`Update Status — ${eq.id}`}>

          <label className="text-[11px] text-slate-500 uppercase tracking-wide">New Status</label>

            className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50"

                <label className="text-[11px] text-slate-500 uppercase tracking-wide">Problem Category</label>
                <select value={problemCategory} onChange={(e) => setProblemCategory(e.target.value)} className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2 py-2 text-sm text-slate-200">
                  {["Electrical", "Mechanical", "Hydraulic", "Structural", "Software", "Other"].map((c) => <option key={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[11px] text-slate-500 uppercase tracking-wide">PIC</label>
                <input value={pic} onChange={(e) => setPic(e.target.value)} placeholder="Maintenance team / name" className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200 placeholder-slate-600" />
              </div>
            </div>
            <div>
              <label className="text-[11px] text-slate-500 uppercase tracking-wide">Target Recovery (ETA)</label>
              <input type="datetime-local" value={eta} onChange={(e) => setEta(e.target.value)} className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200" />
            </div>
            <div className="flex items-center gap-1.5 text-[11px] text-slate-500"><Camera size={12} /> Photo attachment available in P1 (post-pilot)</div>
          </>
        )}

        {recovering && incident && (
          <div className="text-xs text-emerald-400 bg-emerald-500/10 ring-1 ring-emerald-500/30 rounded-md px-2.5 py-2">
            Recovering will close {incident.id} and log downtime of {fmtDuration(Date.now() - new Date(incident.startTime).getTime())}.
          </div>
        )}

        <div className="flex gap-2 pt-2">
          <button onClick={onClose} className="flex-1 border border-slate-700 text-slate-300 rounded-md py-2 text-sm hover:bg-slate-900">Cancel</button>
          <button
            disabled={goingToBreakdown && !remark.trim()}
            onClick={() => onSubmit({
              eq, newStatus, remark: remark.trim() || eq.remark,
              problemCategory, pic, eta: eta ? new Date(eta).toISOString() : null,
            })}
            className="flex-1 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 disabled:cursor-not-allowed text-slate-950 font-medium rounded-md py-2 text-sm"
          >Save</button>
        </div>
      </div>
    </Modal>
  );
}

/* ---------------------------------------------------------------------- */
/* Add equipment modal                                                     */
/* ---------------------------------------------------------------------- */

function AddEquipmentModal({ onClose, onSubmit }) {
  const [id, setId] = useState("");
  const [name, setName] = useState("");
  const [category, setCategory] = useState("QCC");
  const [subArea, setSubArea] = useState("T1");
  const [criticality, setCriticality] = useState("normal");

  return (
    <Modal onClose={onClose} title="Add Equipment (Master Data)">
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="text-[11px] text-slate-500 uppercase tracking-wide">Equipment ID</label>
            <input value={id} onChange={(e) => setId(e.target.value.toUpperCase())} placeholder="e.g. QCC-07" className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200 font-mono" />
          </div>
          <div>
            <label className="text-[11px] text-slate-500 uppercase tracking-wide">Category</label>
            <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2 py-2 text-sm text-slate-200">
              {["QCC", "RTG", "RMGC", "RS", "HDT"].map((c) => <option key={c}>{c}</option>)}
            </select>
          </div>
        </div>
        <div>
          <label className="text-[11px] text-slate-500 uppercase tracking-wide">Name</label>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Full equipment name" className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200" />
        </div>
        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="text-[11px] text-slate-500 uppercase tracking-wide">Sub-Area</label>
            <select value={subArea} onChange={(e) => setSubArea(e.target.value)} className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2 py-2 text-sm text-slate-200">
              {SUB_AREAS.map((s) => <option key={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[11px] text-slate-500 uppercase tracking-wide">Criticality</label>
            <select value={criticality} onChange={(e) => setCriticality(e.target.value)} className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2 py-2 text-sm text-slate-200">
              <option value="normal">Normal</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>
        <div className="flex gap-2 pt-2">
          <button onClick={onClose} className="flex-1 border border-slate-700 text-slate-300 rounded-md py-2 text-sm hover:bg-slate-900">Cancel</button>
          <button
            disabled={!id.trim() || !name.trim()}
            onClick={() => onSubmit({ id: id.trim(), name: name.trim(), category, subArea, criticality })}
            className="flex-1 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 text-slate-950 font-medium rounded-md py-2 text-sm"
          >Add</button>
        </div>
      </div>
    </Modal>
  );
}

/* ---------------------------------------------------------------------- */
/* Handover tab + modal                                                    */
/* ---------------------------------------------------------------------- */

function HandoverTab({ handovers, onNew, canHandover }) {
  return (
    <div className="p-5 space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-sm font-semibold text-slate-100">Shift Handover Log</h2>
        {canHandover && (
          <button onClick={onNew} className="flex items-center gap-1.5 bg-cyan-500/10 text-cyan-300 ring-1 ring-cyan-500/30 rounded-md px-3 py-2 text-sm hover:bg-cyan-500/20">
            <Plus size={14} /> New Handover
          </button>
        )}
      </div>
      {handovers.length === 0 ? (
        <div className="text-center text-slate-500 text-sm py-12 border border-dashed border-slate-800 rounded-xl">No handovers recorded yet.</div>
      ) : (
        <div className="space-y-3">
          {handovers.map((h) => (
            <div key={h.id} className="rounded-xl border border-slate-800 bg-slate-900/60 p-4 space-y-2">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2 text-sm font-medium text-slate-100"><UserCircle2 size={15} className="text-cyan-400" /> {h.shift}</div>
                <div className="text-[11px] font-mono text-slate-500">{fmtDateTime(h.createdAt)}</div>
              </div>
              <div className="text-xs text-slate-400">{h.fromUser} → {h.toUser}</div>
              <div className="grid sm:grid-cols-2 gap-2 text-xs">
                <Info label="Opening Condition" value={h.openingSummary || "-"} />
                <Info label="Closing Condition" value={h.closingSummary || "-"} />
              </div>
              <Info label="Activity During Shift" value={h.activities || "-"} />
              {h.unresolvedIssues && (
                <div className="rounded-md bg-amber-400/10 ring-1 ring-amber-400/30 px-2.5 py-2">
                  <div className="text-[10px] text-amber-400 uppercase tracking-wide">Unresolved / Critical to follow-up</div>
                  <div className="text-xs text-amber-200 mt-0.5">{h.unresolvedIssues}</div>
                </div>
              )}
              <div className="text-[10.5px] text-emerald-400 font-mono">✓ Accepted by {h.acceptedBy || h.toUser}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function HandoverModal({ onClose, onSubmit, equipment, needAttention }) {
  const [shift, setShift] = useState("Shift 1 (06:00–14:00)");
  const [fromUser, setFromUser] = useState("");
  const [toUser, setToUser] = useState("");
  const [activities, setActivities] = useState("");
  const [unresolvedIssues, setUnresolvedIssues] = useState(
    needAttention.length ? needAttention.map((n) => `${n.eq.id}: ${n.inc.problem} (${n.level})`).join("\n") : ""
  );

  const opening = `${equipment.filter((e) => e.status === "READY").length} Ready, ${equipment.filter((e) => e.status === "BREAKDOWN").length} Breakdown at handover time`;

  return (
    <Modal onClose={onClose} title="New Shift Handover">
      <div className="space-y-3">
        <div>
          <label className="text-[11px] text-slate-500 uppercase tracking-wide">Shift</label>
          <select value={shift} onChange={(e) => setShift(e.target.value)} className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2 py-2 text-sm text-slate-200">
            {["Shift 1 (06:00–14:00)", "Shift 2 (14:00–22:00)", "Shift 3 (22:00–06:00)"].map((s) => <option key={s}>{s}</option>)}
          </select>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="text-[11px] text-slate-500 uppercase tracking-wide">Outgoing Admin</label>
            <input value={fromUser} onChange={(e) => setFromUser(e.target.value)} placeholder="Name" className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200" />
          </div>
          <div>
            <label className="text-[11px] text-slate-500 uppercase tracking-wide">Incoming Admin</label>
            <input value={toUser} onChange={(e) => setToUser(e.target.value)} placeholder="Name" className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200" />
          </div>
        </div>
        <Info label="Opening / Closing Condition (auto)" value={opening} />
        <div>
          <label className="text-[11px] text-slate-500 uppercase tracking-wide">Activity During Shift</label>
          <textarea value={activities} onChange={(e) => setActivities(e.target.value)} rows={2} placeholder="New breakdowns, recoveries, maintenance activity…" className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200 placeholder-slate-600" />
        </div>
        <div>
          <label className="text-[11px] text-slate-500 uppercase tracking-wide">Unresolved / Critical Issues</label>
          <textarea value={unresolvedIssues} onChange={(e) => setUnresolvedIssues(e.target.value)} rows={2} className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200" />
        </div>
        <div className="flex gap-2 pt-2">
          <button onClick={onClose} className="flex-1 border border-slate-700 text-slate-300 rounded-md py-2 text-sm hover:bg-slate-900">Cancel</button>
          <button
            disabled={!fromUser.trim() || !toUser.trim()}
            onClick={() => onSubmit({
              shift, fromUser: fromUser.trim(), toUser: toUser.trim(),
              openingSummary: opening, closingSummary: opening, activities, unresolvedIssues,
              acceptedBy: toUser.trim(),
            })}
            className="flex-1 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 text-slate-950 font-medium rounded-md py-2 text-sm"
          >Accept & Submit</button>
        </div>
      </div>
    </Modal>
  );
}

/* ---------------------------------------------------------------------- */
/* Audit tab                                                                */
/* ---------------------------------------------------------------------- */

function AuditTab({ audit }) {
  return (
    <div className="p-5 space-y-3">
      <h2 className="text-sm font-semibold text-slate-100">Audit Trail</h2>
      <div className="rounded-xl border border-slate-800 overflow-hidden">
        <table className="w-full text-xs">
          <thead>
            <tr className="bg-slate-900 text-slate-400 uppercase tracking-wide text-[10.5px]">
              <th className="text-left px-3 py-2">Timestamp</th>
              <th className="text-left px-3 py-2">User</th>
              <th className="text-left px-3 py-2">Action</th>
              <th className="text-left px-3 py-2">Target</th>
              <th className="text-left px-3 py-2">Detail</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-800">
            {audit.map((a) => (
              <tr key={a.id} className="hover:bg-slate-900/50">
                <td className="px-3 py-2 font-mono text-slate-500">{fmtDateTime(a.timestamp)}</td>
                <td className="px-3 py-2 text-slate-300">{a.user}</td>
                <td className="px-3 py-2 text-cyan-400">{a.action}</td>
                <td className="px-3 py-2 font-mono text-slate-300">{a.target}</td>
                <td className="px-3 py-2 text-slate-500">{a.detail}</td>
              </tr>
            ))}
            {audit.length === 0 && <tr><td colSpan={5} className="text-center text-slate-500 py-8">No activity recorded yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Modal shell                                                             */
/* ---------------------------------------------------------------------- */

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/70" onClick={onClose} />
      <div className="relative w-full max-w-md bg-slate-950 border border-slate-800 rounded-xl shadow-2xl max-h-[90vh] overflow-y-auto">
        <div className="sticky top-0 bg-slate-950 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
          <h3 className="text-sm font-semibold text-slate-100">{title}</h3>
          <button onClick={onClose} className="text-slate-500 hover:text-slate-200"><X size={18} /></button>
        </div>
        <div className="p-4">{children}</div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
