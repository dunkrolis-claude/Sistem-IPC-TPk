<script>
  // window.storage / window.firebaseAuth must exist SYNCHRONOUSLY (the Babel
  // app script below may run before the async Firebase module finishes
  // initializing), so we install thin wrappers here immediately. Each method
  // awaits __firebaseReady, then delegates to the real implementation that
  // the module script below installs on window.__storageImpl / __authImpl.
  window.__firebaseReady = new Promise((resolve) => { window.__firebaseReadyResolve = resolve; });

  // Safety net: if the Firebase module (loaded from Google's CDN) hasn't
  // finished initializing within 6s — blocked network, ad-blocker, wrong
  // config, CDN hiccup — fall back to local-only storage/login instead of
  // leaving the app stuck on the loading screen forever.
  setTimeout(() => {
    if (window.__storageImpl) return; // Firebase already initialized in time
    console.warn("[ERCT] Firebase did not initialize in time — falling back to local storage.");
    window.__storageImpl = {
      async get(key) { const raw = localStorage.getItem(key); return raw === null ? null : { key, value: raw, shared: false }; },
      async set(key, value) { localStorage.setItem(key, value); return { key, value, shared: false }; },
      async delete(key) { const existed = localStorage.getItem(key) !== null; localStorage.removeItem(key); return { key, deleted: existed, shared: false }; },
      async list(prefix) { prefix = prefix || ""; const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix)); return { keys, prefix, shared: false }; },
    };
    window.firebaseAuth = null; // app falls back to the local username/password check
    window.__firebaseReadyResolve();
  }, 6000);

  window.storage = {
    get: async (key) => { await window.__firebaseReady; return window.__storageImpl.get(key); },
    set: async (key, value) => { await window.__firebaseReady; return window.__storageImpl.set(key, value); },
    delete: async (key) => { await window.__firebaseReady; return window.__storageImpl.delete(key); },
    list: async (prefix) => { await window.__firebaseReady; return window.__storageImpl.list(prefix); },
  };
  window.firebaseAuth = {
    signIn: async (u, p) => { await window.__firebaseReady; if (!window.__authImpl) throw new Error("Firebase tidak tersedia saat ini."); return window.__authImpl.signIn(u, p); },
    signOut: async () => { await window.__firebaseReady; if (window.__authImpl) return window.__authImpl.signOut(); },
    restoreSession: async () => { await window.__firebaseReady; return window.__authImpl ? window.__authImpl.restoreSession() : null; },
    seedDemoAccounts: async (users, onProgress) => { await window.__firebaseReady; if (!window.__authImpl) throw new Error("Firebase tidak tersedia saat ini."); return window.__authImpl.seedDemoAccounts(users, onProgress); },
  };
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs,
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, onAuthStateChanged, setPersistence, browserLocalPersistence,
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCs3BRvuJMCCC2-5gznnOCxa0zH68QJarI",
    authDomain: "ipc-tpk.firebaseapp.com",
    projectId: "ipc-tpk",
    storageBucket: "ipc-tpk.firebasestorage.app",
    messagingSenderId: "68450681592",
    appId: "1:68450681592:web:d8a67bff6a337e1b1ef10d",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  try { await setPersistence(auth, browserLocalPersistence); } catch (e) {}

  const KV_COLLECTION = "erct_kv";
  const PROFILES_COLLECTION = "profiles";
  const emailFor = (username) => (username.includes("@") ? username : `${username.toLowerCase()}@ipctpk.local`);

  // Real implementation — installed on window.__storageImpl, called via the
  // synchronous window.storage wrapper defined above.
  window.__storageImpl = {
    async get(key) {
      const snap = await getDoc(doc(db, KV_COLLECTION, key));
      if (!snap.exists()) return null;
      return { key, value: snap.data().value, shared: true };
    },
    async set(key, value) {
      await setDoc(doc(db, KV_COLLECTION, key), { value, updatedAt: Date.now() });
      return { key, value, shared: true };
    },
    async delete(key) {
      const snap = await getDoc(doc(db, KV_COLLECTION, key));
      const existed = snap.exists();
      if (existed) await deleteDoc(doc(db, KV_COLLECTION, key));
      return { key, deleted: existed, shared: true };
    },
    async list(prefix) {
      prefix = prefix || "";
      const snaps = await getDocs(collection(db, KV_COLLECTION));
      const keys = [];
      snaps.forEach((d) => { if (d.id.startsWith(prefix)) keys.push(d.id); });
      return { keys, prefix, shared: true };
    },
  };

  window.__authImpl = {
    async signIn(username, password) {
      const email = emailFor(username.trim());
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await getDoc(doc(db, PROFILES_COLLECTION, cred.user.uid));
      if (!snap.exists()) throw new Error("Login berhasil tapi profil pengguna tidak ditemukan di Firestore. Hubungi System Admin.");
      return { id: cred.user.uid, ...snap.data() };
    },
    async signOut() {
      try { await signOut(auth); } catch (e) {}
    },
    restoreSession() {
      return new Promise((resolve) => {
        const unsub = onAuthStateChanged(auth, async (user) => {
          unsub();
          if (!user) return resolve(null);
          try {
            const snap = await getDoc(doc(db, PROFILES_COLLECTION, user.uid));
            resolve(snap.exists() ? { id: user.uid, ...snap.data() } : null);
          } catch (e) { resolve(null); }
        });
      });
    },
    // One-time client-side seeding of demo accounts from the app's Users
    // master data into real Firebase Auth + Firestore profiles. Safe to
    // re-run — accounts that already exist are skipped automatically.
    async seedDemoAccounts(users, onProgress) {
      let created = 0, skipped = 0, failed = 0;
      for (const u of users) {
        if (!u.username || !u.tempPassword) { skipped++; onProgress && onProgress({ created, skipped, failed, total: users.length }); continue; }
        const email = emailFor(u.username);
        try {
          const cred = await createUserWithEmailAndPassword(auth, email, u.tempPassword);
          await setDoc(doc(db, PROFILES_COLLECTION, cred.user.uid), {
            name: u.name, username: u.username, role: u.role, areas: u.areas || [],
          });
          created++;
        } catch (err) {
          skipped++;
        }
        onProgress && onProgress({ created, skipped, failed, total: users.length });
      }
      try { await signOut(auth); } catch (e) {}
      return { created, skipped, failed };
    },
  };

  window.__firebaseReadyResolve();
</script>

// Real baseline imported from "Profile Alat Alat IPC TPK.xlsx" — 384 equipment / 13 operational areas.
function generateEquipmentBaseline() {
  return REAL_EQUIPMENT_BASELINE.map((e) => ({
    id: e.id,
    name: e.name,
    category: e.category,
    areaCode: e.areaCode,
    criticality: e.criticality,
    status: e.status,
    remark: e.remark,
    lastUpdate: hoursAgo(e.hoursAgoSeed),
    updatedBy: "System (baseline import — Profile Alat Alat IPC TPK.xlsx)",
    active: true,
  }));
}

function seedIncidents(equipment) {
  const bd = equipment.filter((e) => e.status === "BREAKDOWN");
  return bd.map((eq, i) => ({
    id: `INC-${String(i + 1).padStart(4, "0")}`,
    equipmentId: eq.id,
    problemCategory: "Electrical",
    problem: eq.remark,
    pic: "Maintenance Team",
    eta: i % 2 === 0 ? hoursAgo(2.5) : hoursAgo(-4),

function fmtDateTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} ${hh}:${mm}`;
}
function fmtDuration(ms) {
  if (ms < 0) ms = 0;
  const totalMin = Math.floor(ms / 60000);
  return `${Math.floor(totalMin / 60)}h ${totalMin % 60}m`;
}
function uid(prefix) { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`; }

async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, true);
    if (res && res.value) return JSON.parse(res.value);
    return fallback;
  } catch { return fallback; }
}
async function saveKey(key, value) {
  try { await window.storage.set(key, JSON.stringify(value), true); } catch (e) { console.error("storage save failed", key, e); }
}

function getPriority(eq, incident, now) {
  if (!incident || incident.status !== "open") return null;
  const start = new Date(incident.startTime).getTime();
  const downtimeMs = now - start;
  const downtimeH = downtimeMs / 3600000;
  const etaExceeded = incident.eta && now > new Date(incident.eta).getTime();
  const lastActivity = incident.updates.length ? new Date(incident.updates[incident.updates.length - 1].timestamp).getTime() : start;
  const stale = (now - lastActivity) / 3600000 > 2;

  let level = "HIGH";
  if (downtimeH > 8 || etaExceeded || eq.criticality === "critical") level = "CRITICAL";
  const flags = [];
  if (etaExceeded) flags.push("ETA OVERDUE");
  if (stale) flags.push("STALE UPDATE");
  if (eq.criticality === "critical") flags.push("CRITICAL EQUIPMENT");
  return { level, flags, downtimeMs, stale, etaExceeded };
}

function areaName(code) { return AREAS.find((a) => a.code === code)?.name || code; }
function subAreaName(subAreas, id) { if (!id) return null; return subAreas.find((s) => s.id === id)?.name || null; }

/* ---------------------------------------------------------------------- */
/* Photo compression (client-side, keeps localStorage usage small)         */
/* ---------------------------------------------------------------------- */

function compressImageFile(file, maxWidth = 640, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new window.Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------------------- */
/* Excel export/import (SheetJS)                                           */
/* ---------------------------------------------------------------------- */

function exportRowsToExcel(filename, sheetName, rows) {
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([buf], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function pick(row, keys) {
  for (const k of keys) {
    for (const rk of Object.keys(row)) {
      if (rk.toLowerCase().replace(/[\s_]/g, "") === k.toLowerCase().replace(/[\s_]/g, "")) return row[rk];
    }
  }
  return undefined;
}

              canMaster={ROLES[role].canMaster} onAddEquipment={() => setAddEqOpen(true)} triggerPrint={triggerPrint} />
          )}
          {tab === "history" && <HistoryTab history={history.filter((h) => scopedAreaCodes.includes(h.areaCode))} triggerPrint={triggerPrint} />}
          {tab === "handover" && <HandoverTab handovers={handovers} onNew={() => setHandoverOpen(true)} canHandover={ROLES[role].canHandover} />}
          {tab === "admin" && ROLES[role].canMaster && (
            <AdminTab categories={categories} users={users} shifts={shifts} subAreas={subAreas}
              onAddCategory={addCategory} onAddUser={addUser} onAddSubArea={addSubArea} onImportEquipment={importEquipmentFromRows} areaMatrix={AREAS} />
          )}

        <DetailDrawer eq={selectedEq} incident={openIncidentByEq[selectedEq.id]} history={history.filter((h) => h.equipmentId === selectedEq.id)}
          onClose={() => setSelectedId(null)} onUpdate={() => setUpdateModalEq(selectedEq)} onAddProgress={(note) => addProgress(selectedEq, note)}

function initials(name) {
  return (name || "?").split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
}

function LoginScreen({ users, onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [showDemo, setShowDemo] = useState(false);
  const [busy, setBusy] = useState(false);
  const [seedStatus, setSeedStatus] = useState(null); // { running, created, skipped, total } | { done: true, ... }
  const hasFirebase = typeof window !== "undefined" && !!window.firebaseAuth;

  async function submit(e) {
    e.preventDefault();
    setBusy(true);
    setError("");
    try {
      if (hasFirebase) {
        const profile = await window.firebaseAuth.signIn(username.trim(), password);
        onLogin(profile);
      } else {
        await new Promise((r) => setTimeout(r, 250));
        const match = users.find((u) => u.username && u.username.toLowerCase() === username.trim().toLowerCase());
        if (!match || match.tempPassword !== password) throw new Error("Username atau password salah.");
        onLogin(match);
      }
    } catch (err) {
      setError(humanizeAuthError(err));
    }
    setBusy(false);
  }

  async function runSeed() {
    if (!hasFirebase || !window.firebaseAuth.seedDemoAccounts) return;
    setSeedStatus({ running: true, created: 0, skipped: 0, total: users.length });
    const result = await window.firebaseAuth.seedDemoAccounts(users, (p) => setSeedStatus({ running: true, ...p }));
    setSeedStatus({ running: false, done: true, ...result });
  }

  function pickDemo(u) {
    setUsername(u.username);
    setPassword(u.tempPassword);
    setError("");
    setShowDemo(false);
  }

  const demoGroups = [
    ["Administrator", users.find((u) => u.role === "ADMINISTRATOR")],
    ["Manager", users.find((u) => u.role === "MANAGER")],
    ["Pengguna Area (contoh)", users.find((u) => u.role === "AREA_USER")],
  ].filter(([, u]) => u);

  return (
    <div className="h-screen w-full flex items-center justify-center bg-slate-950 relative overflow-hidden px-4" style={{ fontFamily: "Inter, ui-sans-serif, system-ui" }}>
      <div className="pointer-events-none absolute -top-40 -left-40 h-96 w-96 rounded-full bg-cyan-500/10 blur-3xl" />
      <div className="pointer-events-none absolute -bottom-40 -right-40 h-96 w-96 rounded-full bg-emerald-500/10 blur-3xl" />

      <div className="relative w-full max-w-sm">
        <div className="flex flex-col items-center mb-7">
          <div className="h-14 w-14 rounded-2xl bg-gradient-to-br from-cyan-400 to-cyan-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 mb-4">
            <Radio size={26} className="text-slate-950" />
          </div>
          <h1 className="text-xl font-semibold text-slate-50 text-center">Equipment Readiness<br/>Control Tower</h1>
          <p className="text-xs text-slate-500 font-mono mt-1.5">IPC TPK · Multi-Area · PRD v2.1</p>
          {hasFirebase && (
            <span className="mt-2 text-[10px] font-mono text-emerald-400 bg-emerald-500/10 ring-1 ring-emerald-500/30 rounded-full px-2 py-0.5">Firebase Auth + Firestore aktif</span>
          )}
        </div>

        <form onSubmit={submit} className="bg-slate-900/70 border border-slate-800 rounded-2xl shadow-2xl shadow-black/40 p-6 space-y-4 backdrop-blur">
          <div>
            <label className="text-[11px] text-slate-400 uppercase tracking-wide font-medium">Username</label>
            <input autoFocus value={username} onChange={(e) => setUsername(e.target.value)} placeholder="mis. ZN1_admin1"
              className="w-full mt-1.5 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 placeholder-slate-600 font-mono focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-colors" />
          </div>
          <div>
            <label className="text-[11px] text-slate-400 uppercase tracking-wide font-medium">Password</label>
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••"
              className="w-full mt-1.5 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 placeholder-slate-600 font-mono focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-colors" />
          </div>
          {error && <div className="text-xs text-red-400 bg-red-500/10 ring-1 ring-red-500/30 rounded-lg px-3 py-2">{error}</div>}
          <button type="submit" disabled={!username || !password || busy}
            className="w-full bg-gradient-to-r from-cyan-500 to-cyan-400 hover:from-cyan-400 hover:to-cyan-300 disabled:opacity-40 disabled:cursor-not-allowed text-slate-950 font-semibold rounded-lg py-2.5 text-sm transition-all shadow-lg shadow-cyan-500/10">
            {busy ? "Signing in…" : "Sign In"}
          </button>

          <div className="pt-1">
            <button type="button" onClick={() => setShowDemo((s) => !s)} className="text-[11px] text-cyan-400/80 hover:text-cyan-300 flex items-center gap-1 mx-auto">
              <InfoIcon size={12} /> {showDemo ? "Sembunyikan akun demo" : "Lihat akun demo (pilot)"}
            </button>
            {showDemo && (
              <div className="mt-2.5 space-y-1.5">
                {demoGroups.map(([label, u]) => (
                  <button key={u.id} type="button" onClick={() => pickDemo(u)}
                    className="w-full flex items-center justify-between text-left bg-slate-950/60 border border-slate-800 rounded-lg px-3 py-2 hover:border-cyan-500/40 transition-colors">
                    <span className="text-[11px] text-slate-300">{label}</span>
                    <span className="text-[10.5px] font-mono text-slate-500">{u.username}</span>
                  </button>
                ))}
                <p className="text-[10px] text-slate-600 leading-snug pt-1">Password sementara ada di Administration → Users. Kredensial demo ini untuk keperluan pilot, bukan sistem auth produksi akhir.</p>
              </div>
            )}
          </div>
        </form>

        {hasFirebase && (
          <div className="mt-4 bg-slate-900/50 border border-slate-800 rounded-xl p-3.5">
            <button type="button" onClick={runSeed} disabled={seedStatus?.running}
              className="w-full text-[11px] text-slate-300 hover:text-slate-100 flex items-center justify-center gap-1.5 disabled:opacity-50">
              <Settings size={12} /> {seedStatus?.running ? "Membuat akun…" : "Setup akun demo ke Firebase (sekali jalan)"}
            </button>
            {seedStatus && (
              <p className="text-[10px] text-slate-500 text-center mt-1.5">
                {seedStatus.running
                  ? `Memproses ${seedStatus.created + seedStatus.skipped}/${seedStatus.total}…`
                  : `Selesai — ${seedStatus.created} akun dibuat, ${seedStatus.skipped} dilewati (mungkin sudah ada).`}
              </p>
            )}
            <p className="text-[10px] text-slate-600 text-center mt-1 leading-snug">Jalankan sekali saja setelah Firebase pertama kali disambungkan. Aman diklik ulang — akun yang sudah ada otomatis dilewati.</p>
          </div>
        )}

        <p className="text-[10.5px] text-slate-600 text-center mt-5 leading-snug">
          {hasFirebase
            ? "Autentikasi via Firebase Authentication, data tersimpan di Firestore — sinkron real-time antar perangkat."
            : "Prototype pilot — autentikasi berjalan di browser terhadap User Master lokal, belum tersambung ke backend/SSO sungguhan."}
        </p>
      </div>
    </div>
  );
}

function humanizeAuthError(err) {
  const code = err?.code || "";
  if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) return "Username atau password salah.";
  if (code.includes("too-many-requests")) return "Terlalu banyak percobaan gagal — coba lagi beberapa saat.";
  if (code.includes("network")) return "Gagal terhubung ke server. Cek koneksi internet.";
  return err?.message || "Login gagal.";
}

            {needAttention.slice(0, 40).map(({ eq, inc, level, flags, downtimeMs }) => (

                </div>

              </button>
            ))}
          </div>
        )}
      </div>

}

function ReadinessRing({ pct }) {
  const r = 26, c = 2 * Math.PI * r, offset = c - (pct / 100) * c;
  const color = pct >= 90 ? "#34d399" : pct >= 70 ? "#fbbf24" : "#f87171";
  return (
    <svg width="60" height="60" viewBox="0 0 64 64" className="shrink-0">
      <circle cx="32" cy="32" r={r} fill="none" stroke="#1e293b" strokeWidth="6" />
      <circle cx="32" cy="32" r={r} fill="none" stroke={color} strokeWidth="6" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={offset} transform="rotate(-90 32 32)" style={{ transition: "stroke-dashoffset 0.6s ease" }} />
    </svg>
  );
}

function UpdateStatusModal({ eq, incident, onClose, onSubmit }) {
  const [newStatus, setNewStatus] = useState(eq.status);
  const [remark, setRemark] = useState("");
  const [problemCategory, setProblemCategory] = useState("Electrical");
  const [pic, setPic] = useState("");

  const [photoBusy, setPhotoBusy] = useState(false);
  const goingToBreakdown = newStatus === "BREAKDOWN" && eq.status !== "BREAKDOWN";
  const recovering = eq.status === "BREAKDOWN" && newStatus === "READY";

  async function handlePhoto(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setPhotoBusy(true);
    try { setPhotoUrl(await compressImageFile(file)); }
    catch { setPhotoUrl(null); }
    setPhotoBusy(false);
  }

  return (
    <Modal onClose={onClose} title={`Update Status — ${eq.id}`}>
      <div className="space-y-3">
        <div>
          <label className="text-[11px] text-slate-500 uppercase tracking-wide">New Status</label>

        {goingToBreakdown && (

            <div className="grid grid-cols-2 gap-2">
              <div><label className="text-[11px] text-slate-500 uppercase tracking-wide">Problem Category</label>

            </div>
            <div><label className="text-[11px] text-slate-500 uppercase tracking-wide">Target Recovery (ETA)</label>
              <input type="datetime-local" value={eta} onChange={(e) => setEta(e.target.value)} className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200" /></div>
          </>
        )}
        <div>
          <label className="text-[11px] text-slate-500 uppercase tracking-wide flex items-center gap-1.5"><Camera size={12} /> Photo (optional)</label>
          {photoUrl ? (
            <div className="mt-1.5 flex items-center gap-2">
              <img src={photoUrl} alt="attachment preview" className="h-16 w-16 object-cover rounded-md border border-slate-700" />
              <button onClick={() => setPhotoUrl(null)} className="text-xs text-red-400 hover:text-red-300">Remove</button>
            </div>

            <label className="mt-1.5 flex items-center gap-2 border border-dashed border-slate-700 rounded-md px-3 py-2 text-xs text-slate-500 cursor-pointer hover:border-slate-500">
              <Camera size={14} /> {photoBusy ? "Processing…" : "Attach photo"}

            </label>
          )}
          <div className="text-[10px] text-slate-600 mt-1">Compressed client-side for the prototype's local storage — production needs real cloud file storage.</div>

        {recovering && incident && (
          <div className="text-xs text-emerald-400 bg-emerald-500/10 ring-1 ring-emerald-500/30 rounded-md px-2.5 py-2">

        <div className="flex gap-2 pt-2">
          <button onClick={onClose} className="flex-1 border border-slate-700 text-slate-300 rounded-md py-2 text-sm hover:bg-slate-900">Cancel</button>

        </div>
      </div>

}

function genTempPassword(username) {
  const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
  return `Ipctpk#${(username || "user").slice(0, 4).toUpperCase()}${rand}26`;
}

function AdminTab({ categories, users, shifts, subAreas, onAddCategory, onAddUser, onAddSubArea, onImportEquipment, areaMatrix }) {
  const [sub, setSub] = useState("areas");
  const [newCat, setNewCat] = useState("");
  const [userForm, setUserForm] = useState({ name: "", username: "", role: "AREA_USER", areas: [] });
  const [revealed, setRevealed] = useState({});
  const [subAreaForm, setSubAreaForm] = useState({ areaCode: AREAS[0].code, name: "" });
  const [importResult, setImportResult] = useState(null);
  const [importBusy, setImportBusy] = useState(false);
  const fileInputRef = useRef(null);

  const subTabs = [["areas","Operational Areas"],["subareas","Sub Areas"],["categories","Equipment Categories"],["users","Users"],["shifts","Shifts"],["import","Import Equipment"]];

  async function handleImportFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportBusy(true); setImportResult(null);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      const result = onImportEquipment(rows);
      setImportResult({ ...result, total: rows.length });
    } catch (err) {
      setImportResult({ error: String(err.message || err) });
    }
    setImportBusy(false);
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  return (
    <div className="p-4 sm:p-5 space-y-4">
      <h2 className="text-sm font-semibold text-slate-100">Administration — Master Data</h2>
      <div className="flex gap-1.5 flex-wrap">
        {subTabs.map(([k,l]) => <button key={k} onClick={() => setSub(k)} className={`text-xs px-3 py-1.5 rounded-full border ${sub===k?"bg-slate-100 text-slate-900 border-slate-100":"border-slate-700 text-slate-400"}`}>{l}</button>)}
      </div>

      {sub === "areas" && (
        <div className="rounded-xl border border-slate-800 overflow-hidden">
          <table className="w-full text-xs">
            <thead><tr className="bg-slate-900 text-slate-400 uppercase text-[10.5px]"><th className="text-left px-3 py-2">Area</th><th className="text-left px-3 py-2">Code</th><th className="text-left px-3 py-2">Full Code</th><th className="text-left px-3 py-2">Admin Model</th><th className="text-right px-3 py-2">Baseline Count</th></tr></thead>
            <tbody className="divide-y divide-slate-800">
              {areaMatrix.map((a) => <tr key={a.code}><td className="px-3 py-2 text-slate-200">{a.name}</td><td className="px-3 py-2 font-mono text-slate-400">{a.code}</td><td className="px-3 py-2 font-mono text-slate-600 text-[10.5px]">{a.fullCode}</td><td className="px-3 py-2 text-slate-400">{a.adminModel}</td><td className="px-3 py-2 text-right font-mono text-slate-300">{a.count}</td></tr>)}
            </tbody>
          </table>
          <div className="px-3 py-2 text-[10.5px] text-slate-600 border-t border-slate-800">13 operational areas per PRD §2 baseline. Editing/deactivating areas is a Super Admin action — add real create/edit here once connected to a backend.</div>
        </div>
      )}

      {sub === "categories" && (
        <div className="space-y-3">
          <div className="flex gap-2">
            <input value={newCat} onChange={(e) => setNewCat(e.target.value.toUpperCase())} placeholder="New category code, e.g. STS" className="bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200 font-mono" />
            <button disabled={!newCat.trim()} onClick={() => { onAddCategory(newCat.trim()); setNewCat(""); }} className="bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 text-slate-950 font-medium rounded-md px-3 py-2 text-sm">Add</button>
          </div>
          <div className="flex flex-wrap gap-1.5">{categories.map((c) => <span key={c.code} className="text-xs font-mono bg-slate-900 border border-slate-700 rounded-md px-2.5 py-1 text-slate-300">{c.code}</span>)}</div>
        </div>
      )}

      {sub === "users" && (
        <div className="space-y-3">
          <div className="text-[10.5px] text-amber-400 bg-amber-400/10 ring-1 ring-amber-400/30 rounded-md px-2.5 py-1.5">
            Temporary passwords, plaintext in browser storage — fine for demoing this prototype, <strong>not safe for real production</strong>. A real deployment needs hashed passwords / SSO (PRD §18) and users should rotate these on first real login.
          </div>
          <div className="rounded-xl border border-slate-800 p-3 space-y-2">
            <div className="grid sm:grid-cols-2 gap-2">
              <input value={userForm.name} onChange={(e) => setUserForm({ ...userForm, name: e.target.value })} placeholder="Full name" className="bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200" />
              <input value={userForm.username} onChange={(e) => setUserForm({ ...userForm, username: e.target.value.toLowerCase() })} placeholder="username" className="bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200 font-mono" />
            </div>
            <select value={userForm.role} onChange={(e) => setUserForm({ ...userForm, role: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-md px-2 py-2 text-sm text-slate-200">
              {Object.entries(ROLES).map(([k,r]) => <option key={k} value={k}>{r.label}</option>)}

                  <input type="checkbox" checked={userForm.areas.includes(a.code)} onChange={() => setUserForm((f) => ({ ...f, areas: f.areas.includes(a.code) ? f.areas.filter((c) => c!==a.code) : [...f.areas, a.code] }))} className="accent-cyan-500" />

          </div>

              <tbody className="divide-y divide-slate-800">
                {users.map((u) => (
                  <tr key={u.id}>
                    <td className="px-3 py-2 text-slate-200">{u.name}</td>
                    <td className="px-3 py-2 font-mono text-slate-400">{u.username || "-"}</td>
                    <td className="px-3 py-2 font-mono">
                      {u.tempPassword ? (
                        <button onClick={() => setRevealed((r) => ({ ...r, [u.id]: !r[u.id] }))} className="text-slate-400 hover:text-slate-200">
                          {revealed[u.id] ? u.tempPassword : "••••••••••"}

                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="flex justify-end">
            <button onClick={() => exportRowsToExcel(`ERCT_Users_${Date.now()}.xlsx`, "Users", users.map((u) => ({ Name: u.name, Username: u.username, "Temp Password": u.tempPassword, Role: ROLES[u.role]?.label, Areas: u.areas.join(", ") })))}

          </div>
        </div>
      )}

      {sub === "shifts" && (
        <div className="rounded-xl border border-slate-800 overflow-hidden">
          <table className="w-full text-xs">
            <thead><tr className="bg-slate-900 text-slate-400 uppercase text-[10.5px]"><th className="text-left px-3 py-2">Shift</th><th className="text-left px-3 py-2">Hours</th></tr></thead>
            <tbody className="divide-y divide-slate-800">{shifts.map((s) => <tr key={s.id}><td className="px-3 py-2 text-slate-200">{s.name}</td><td className="px-3 py-2 font-mono text-slate-400">{s.hours}</td></tr>)}</tbody>
          </table>
          <div className="px-3 py-2 text-[10.5px] text-slate-600 border-t border-slate-800">Shift hours are configurable per operational area per PRD §24 open decision — currently a shared global default.</div>
        </div>
      )}

      {sub === "subareas" && (
        <div className="space-y-3">
          <div className="rounded-xl border border-slate-800 p-3 flex flex-col sm:flex-row gap-2">
            <select value={subAreaForm.areaCode} onChange={(e) => setSubAreaForm({ ...subAreaForm, areaCode: e.target.value })} className="bg-slate-900 border border-slate-700 rounded-md px-2 py-2 text-sm text-slate-200">
              {AREAS.map((a) => <option key={a.code} value={a.code}>{a.name}</option>)}
            </select>
            <input value={subAreaForm.name} onChange={(e) => setSubAreaForm({ ...subAreaForm, name: e.target.value })} placeholder="Sub area name, e.g. Dermaga 2" className="flex-1 bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-sm text-slate-200" />
            <button disabled={!subAreaForm.name.trim()} onClick={() => { onAddSubArea(subAreaForm.areaCode, subAreaForm.name.trim()); setSubAreaForm({ ...subAreaForm, name: "" }); }} className="bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 text-slate-950 font-medium rounded-md px-3 py-2 text-sm">Add</button>
          </div>
          <div className="rounded-xl border border-slate-800 overflow-hidden">
            <table className="w-full text-xs">
              <thead><tr className="bg-slate-900 text-slate-400 uppercase text-[10.5px]"><th className="text-left px-3 py-2">Sub Area</th><th className="text-left px-3 py-2">Operational Area</th></tr></thead>
              <tbody className="divide-y divide-slate-800">
                {subAreas.map((s) => <tr key={s.id}><td className="px-3 py-2 text-slate-200">{s.name}</td><td className="px-3 py-2 text-slate-400 font-mono">{areaName(s.areaCode)}</td></tr>)}
                {subAreas.length === 0 && <tr><td colSpan={2} className="text-center text-slate-500 py-6">No sub areas defined yet.</td></tr>}
              </tbody>
            </table>
          </div>
          <div className="text-[10.5px] text-slate-600">Manual master data per PRD §C — Sub Area is optional on each equipment record.</div>
        </div>
      )}

      {sub === "import" && (
        <div className="space-y-3">
          <div className="rounded-xl border border-dashed border-slate-700 p-5 text-center">
            <Upload size={22} className="mx-auto text-slate-500 mb-2" />
            <div className="text-sm text-slate-300 mb-1">Import Equipment Master from Excel / CSV</div>
            <div className="text-[11px] text-slate-500 mb-3 max-w-md mx-auto">
              Expected columns (header names are matched loosely): <span className="font-mono text-slate-400">Equipment Code, Equipment Name, Category, Area Code, Criticality</span>.
              Existing codes are updated in place; new codes are created as READY. Status/history are never touched by import.
            </div>
            <label className="inline-flex items-center gap-1.5 bg-cyan-500/10 text-cyan-300 ring-1 ring-cyan-500/30 rounded-md px-3 py-2 text-xs cursor-pointer hover:bg-cyan-500/20">
              <FileSpreadsheet size={14} /> {importBusy ? "Importing…" : "Choose file (.xlsx / .csv)"}
              <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleImportFile} disabled={importBusy} />
            </label>
          </div>
          {importResult && (
            importResult.error ? (
              <div className="text-xs text-red-400 bg-red-500/10 ring-1 ring-red-500/30 rounded-md px-3 py-2">Import failed: {importResult.error}</div>
            ) : (
              <div className="text-xs text-emerald-400 bg-emerald-500/10 ring-1 ring-emerald-500/30 rounded-md px-3 py-2">
                Processed {importResult.total} rows — {importResult.created} created, {importResult.updated} updated, {importResult.skipped} skipped (missing/unknown code or area).
              </div>
            )
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Audit tab                                                                */
/* ---------------------------------------------------------------------- */

function AuditTab({ audit }) {
  return (
    <div className="p-4 sm:p-5 space-y-3">
      <h2 className="text-sm font-semibold text-slate-100">Audit Trail</h2>
      <div className="rounded-xl border border-slate-800 overflow-hidden">
        <table className="w-full text-xs">
          <thead><tr className="bg-slate-900 text-slate-400 uppercase tracking-wide text-[10.5px]"><th className="text-left px-3 py-2">Timestamp</th><th className="text-left px-3 py-2">User</th><th className="text-left px-3 py-2">Action</th><th className="text-left px-3 py-2">Target</th><th className="text-left px-3 py-2">Detail</th></tr></thead>
          <tbody className="divide-y divide-slate-800">
            {audit.map((a) => <tr key={a.id} className="hover:bg-slate-900/50"><td className="px-3 py-2 font-mono text-slate-500">{fmtDateTime(a.timestamp)}</td><td className="px-3 py-2 text-slate-300">{a.user}</td><td className="px-3 py-2 text-cyan-400">{a.action}</td><td className="px-3 py-2 font-mono text-slate-300">{a.target}</td><td className="px-3 py-2 text-slate-500">{a.detail}</td></tr>)}
            {audit.length === 0 && <tr><td colSpan={5} className="text-center text-slate-500 py-8">No activity recorded yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
